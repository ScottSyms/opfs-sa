<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuckDB-WASM OPFS Parquet Query</title>
    <link href="https://api.tiles.mapbox.com/mapbox-gl-js/v1.13.0/mapbox-gl.css" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@^3/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        background: #1f1f1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background: #1f1f1f;
        color: #f5f5f5;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        border-bottom: 1px solid #343434;
        background: #151515;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      #status {
        overflow: hidden;
        color: #bdbdbd;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main {
        width: 100%;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 16px;
      }

      .query-panel {
        display: grid;
        gap: 12px;
        max-width: 1200px;
        margin: 0 auto;
      }

      label {
        color: #d8d8d8;
        font-size: 13px;
        font-weight: 700;
      }

      .map-panel {
        display: grid;
        gap: 8px;
      }

      .panel-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }

      #map-status {
        overflow: hidden;
        color: #bdbdbd;
        font-size: 12px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .map-status-group {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 10px;
        min-width: 0;
      }

      .opacity-control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #bdbdbd;
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
      }

      .opacity-control input {
        width: 96px;
        accent-color: #ff35a0;
      }

      #aggregate-opacity-value {
        min-width: 4ch;
        color: #f5f5f5;
        font-variant-numeric: tabular-nums;
      }

      #zoom-status {
        color: #8ab4f8;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #map {
        position: relative;
        overflow: hidden;
        width: 100%;
        min-height: 360px;
        height: min(48vh, 520px);
        border: 1px solid #343434;
        border-radius: 8px;
        background: #0e1117;
      }

      #map-renderer,
      #deck-renderer,
      #kepler-renderer {
        position: absolute;
        inset: 0;
      }

      #map-renderer {
        z-index: 1;
      }

      #deck-renderer {
        z-index: 2;
        pointer-events: none;
      }

      #deck-renderer canvas {
        display: block;
      }

      #kepler-renderer {
        z-index: 0;
        display: none;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #4a4a4a;
        border-radius: 8px;
        outline: none;
        background: #121212;
        color: #f5f5f5;
        font: inherit;
        line-height: 1.45;
      }

      textarea:focus {
        border-color: #8ab4f8;
        box-shadow: 0 0 0 2px rgb(138 180 248 / 20%);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #8ab4f8;
        color: #101010;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      #timing {
        color: #bdbdbd;
        font-size: 12px;
      }

      #results {
        overflow: auto;
        min-height: 180px;
        border: 1px solid #343434;
        border-radius: 8px;
        background: #121212;
      }

      .message {
        margin: 0;
        padding: 14px;
        color: #cfcfcf;
        white-space: pre-wrap;
      }

      .error {
        color: #ffb4ab;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        max-width: 480px;
        padding: 8px 10px;
        border-bottom: 1px solid #2b2b2b;
        text-align: left;
        vertical-align: top;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 0;
        background: #202020;
        color: #f0f0f0;
      }

      td {
        overflow: hidden;
        color: #e8e8e8;
        text-overflow: ellipsis;
      }

      @media (max-width: 720px) {
        .panel-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        #map-status {
          width: 100%;
          text-align: left;
          white-space: normal;
        }

        .map-status-group {
          align-items: flex-start;
          flex-direction: column;
          gap: 2px;
          width: 100%;
        }

        #map {
          min-height: 320px;
          height: 48vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DuckDB-WASM OPFS Parquet Query</h1>
      <div id="status">Loading DuckDB-WASM...</div>
    </header>
    <main>
      <section class="query-panel">
        <div class="map-panel">
          <div class="panel-heading">
            <label>Map output</label>
            <div class="map-status-group">
              <label class="opacity-control" for="aggregate-opacity">
                Aggregate opacity
                <input id="aggregate-opacity" type="range" min="0" max="100" value="50" />
                <span id="aggregate-opacity-value">50%</span>
              </label>
              <span id="zoom-status">Zoom --</span>
              <span id="map-status">Run a query with LAT/LON columns to map points.</span>
            </div>
          </div>
          <div id="map">
            <div id="map-renderer"></div>
            <div id="deck-renderer"></div>
            <div id="kepler-renderer"></div>
          </div>
        </div>
        <label for="query">Query local OPFS parquet file <code>test.parquet</code></label>
        <textarea id="query" spellcheck="false">SELECT MMSI, LAT, LON, VesselName, SOG, COG FROM test_parquet LIMIT 100;</textarea>
        <div class="actions">
          <button id="run" type="button" disabled>Run Query</button>
          <div id="timing">No query run yet.</div>
        </div>
        <div id="results"><p class="message">Initializing...</p></div>
      </section>
    </main>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/redux@4.2.1/dist/redux.js" crossorigin></script>
    <script src="https://unpkg.com/react-redux@8.1.2/dist/react-redux.min.js" crossorigin></script>
    <script src="https://unpkg.com/styled-components@6.1.8/dist/styled-components.min.js" crossorigin></script>
    <script src="https://unpkg.com/maplibre-gl@3/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
    <script src="https://unpkg.com/kepler.gl@3.1.10/umd/keplergl.min.js"></script>

    <script type="module">
      const DUCKDB_WASM_VERSION = "1.33.1-dev45.0";
      const SOURCE_URL = "/test.parquet";
      const REMOTE_URL = window.location.origin + SOURCE_URL;
      const OPFS_FILE_NAME = "test.parquet";
      const PRE_AGGREGATED_FILES = ["ais_position_points.parquet", "ais_latest_positions.parquet"];
      const PRE_AGGREGATED_SOURCE = "/ais_position_points.parquet";
      const PRE_AGGREGATED_SHIP_SOURCE = "/ais_latest_positions.parquet";
      const DENSITY_WASM_URL = "./density_engine.wasm";
      const DENSITY_WORKER_URL = "./density_worker.js";
      const KEPLER_MAP_ID = "query-map";
      const KEPLER_DATA_ID = "query-result";
      const MAX_TABLE_ROWS = 100;
      const MAX_QUERY_PREVIEW_ROWS = 5000;
      const MAX_KEPLER_ROWS = 5000;
      const MAX_INDIVIDUAL_SHIPS = 30000;
      const VIEWPORT_PADDING_RATIO = 0.18;
      const VIEWPORT_RENDER_DEBOUNCE_MS = 200;
      const SHIP_GLYPH_MIN_ZOOM = 6;
      const DENSITY_TILE_SIZE = 512;
      const DENSITY_TILE_MAX_ZOOM = 20;
      const DENSITY_TILE_BUFFER = 1;
      const DENSITY_TILE_CACHE_LIMIT = 256;
      const DENSITY_TILE_FADE_MS = 220;
      const DENSITY_TILE_READY_THRESHOLD = 0.8;
      const DENSITY_TILE_MAX_HOLD_MS = 800;
      const DENSITY_TILE_PARENT_FALLBACK_DEPTH = 2;
      const DENSITY_TILE_REQUEST_DEBOUNCE_MS = 150;
      const MERCATOR_MAX_LATITUDE = 85.05112878;
      const HEXBIN_SCREEN_RADIUS_PX = 12;
      const MIN_HEXBIN_RADIUS_METERS = 100;
      const MAX_HEXBIN_RADIUS_METERS = 250_000;
      const MAP_STYLE_ID = "carto-voyager";
      const MAP_STYLES = {
        [MAP_STYLE_ID]: {
          id: MAP_STYLE_ID,
          label: "Carto Voyager",
          url: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
          icon: "https://carto.com/help/images/building-maps/basemaps/voyager.png",
        },
      };

      const status = document.querySelector("#status");
      const mapElement = document.querySelector("#map");
      const mapRenderer = document.querySelector("#map-renderer");
      const deckRenderer = document.querySelector("#deck-renderer");
      const keplerRenderer = document.querySelector("#kepler-renderer");
      const aggregateOpacityInput = document.querySelector("#aggregate-opacity");
      const aggregateOpacityValue = document.querySelector("#aggregate-opacity-value");
      const zoomStatus = document.querySelector("#zoom-status");
      const mapStatus = document.querySelector("#map-status");
      const queryInput = document.querySelector("#query");
      const runButton = document.querySelector("#run");
      const timing = document.querySelector("#timing");
      const results = document.querySelector("#results");

      let conn;
      let activeRun = 0;
      let keplerStore;
      let keplerRoot;
      let keplerDatasetVersion = 0;
      let mapLibreMap;
      let mapDeckOverlay;
      let deckInstance;
      let aisSpatialReady = false;
      let viewportRenderRun = 0;
      let viewportRenderTimer;
      let latestShipCount = 0;
      let validPositionReportCount = 0;
      let densityWasm;
      let densityWasmExports;
      let densityWorker;
      let densityWorkerReady = false;
      let densityWorkerInitPromise = null;
      let aggregateOpacity = Number(aggregateOpacityInput.value) / 100;
      let activeViewportMode = "tiles";
      let currentViewportShipRows = [];
      let densityTileRenderVersion = 0;
      let densityTileRedrawFrame = 0;
      let densityTileTransitionFrame = 0;
      let densityTileTransitionStart = 0;
      let densityTileTransitionStartedAt = 0;
      let densityTilePreviousKeys = [];
      let densityTileTargetRequests = [];
      let densityTileTargetKeys = [];
      let densityTileDisplayedKeys = [];
      const densityTileCache = new Map();
      const densityTileGenerations = new Map();
      const densityTileRequests = new Map();
      let densityTileDebounceTimer = null;
      let pendingTileRequests = [];
      let currentHexbinPoints = [];
      let currentHexbinLabel = "";
      let selectedShipMmsi = null;
      let selectedShipTrackData = [];
      let selectedShipTrackLayer = null;

      function setStatus(message) {
        status.textContent = message;
      }

      function setMapStatus(message) {
        mapStatus.textContent = message;
      }

      function updateZoomStatus() {
        zoomStatus.textContent = mapLibreMap ? `Zoom ${mapLibreMap.getZoom().toFixed(2)}` : "Zoom --";
      }

      function updateAggregateOpacityStatus() {
        aggregateOpacityValue.textContent = `${Math.round(aggregateOpacity * 100)}%`;
      }

      function setResults(message, className = "message") {
        results.replaceChildren();
        const element = document.createElement("p");
        element.className = className;
        element.textContent = message;
        results.append(element);
      }

      function initializeMapRenderer() {
        const { maplibregl, deck } = window;
        if (!maplibregl || !deck) {
          throw new Error("MapLibre/deck.gl dependencies did not load.");
        }

        mapLibreMap = new maplibregl.Map({
          container: mapRenderer,
          style: MAP_STYLES[MAP_STYLE_ID].url,
          center: [0, 20],
          zoom: 1.25,
          attributionControl: true,
        });
        mapLibreMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
        mapLibreMap.on("error", (event) => {
          const message = event?.error?.message ?? "Map renderer error.";
          setMapStatus(message);
          console.error(event?.error ?? event);
        });

        if (typeof deck.MapboxOverlay === "function") {
          mapDeckOverlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
          mapLibreMap.addControl(mapDeckOverlay);
        } else {
          deckInstance = new deck.Deck({
            parent: deckRenderer,
            controller: false,
            layers: [],
            views: [new deck.MapView({ repeat: true })],
            viewState: getMapViewState(),
          });
        }

        const syncDeckView = () => {
          updateZoomStatus();
          if (deckInstance) deckInstance.setProps({ viewState: getMapViewState() });
        };
        mapLibreMap.on("load", () => {
          syncDeckView();
          requestViewportRender(0);
        });
        mapLibreMap.on("move", syncDeckView);
        mapLibreMap.on("moveend", () => requestViewportRender());
        mapLibreMap.on("zoomend", () => requestViewportRender());
        new ResizeObserver(() => {
          if (deckInstance) deckInstance.setProps({ width: deckRenderer.clientWidth, height: deckRenderer.clientHeight });
          syncDeckView();
          requestViewportRender();
        }).observe(deckRenderer);
      }

      function getMapViewState() {
        if (!mapLibreMap) {
          return { longitude: 0, latitude: 20, zoom: 1.25, bearing: 0, pitch: 0 };
        }
        const center = mapLibreMap.getCenter();
        return {
          longitude: center.lng,
          latitude: center.lat,
          zoom: mapLibreMap.getZoom(),
          bearing: mapLibreMap.getBearing(),
          pitch: mapLibreMap.getPitch(),
        };
      }

      function hasDeckRenderer() {
        return Boolean(mapDeckOverlay || deckInstance);
      }

      function setDeckLayers(layers, props = {}) {
        if (mapDeckOverlay) {
          mapDeckOverlay.setProps({ ...props, layers });
          return;
        }
        if (deckInstance) {
          deckInstance.setProps({ ...props, viewState: getMapViewState(), layers });
        }
      }

      function initializeKeplerMap() {
        const { React, ReactDOM, ReactRedux, Redux, KeplerGl } = window;
        if (!React || !ReactDOM || !ReactRedux || !Redux || !KeplerGl) {
          throw new Error("Kepler.gl dependencies did not load.");
        }

        const keplerReducer = KeplerGl.keplerGlReducer.initialState({
          mapState: {
            latitude: 20,
            longitude: 0,
            zoom: 1.25,
            bearing: 0,
            pitch: 0,
          },
          mapStyle: {
            mapStyles: MAP_STYLES,
            styleType: MAP_STYLE_ID,
          },
          uiState: {
            readOnly: true,
            currentModal: null,
          },
        });
        const reducer = Redux.combineReducers({ keplerGl: keplerReducer });
        const middleware = KeplerGl.enhanceReduxMiddleware([]);
        keplerStore = Redux.createStore(reducer, {}, Redux.compose(Redux.applyMiddleware(...middleware)));
        keplerRoot = ReactDOM.createRoot(keplerRenderer);

        const render = () => {
          const rect = keplerRenderer.getBoundingClientRect();
          const width = Math.max(320, Math.floor(rect.width));
          const height = Math.max(320, Math.floor(rect.height));
          const keplerMap = React.createElement(KeplerGl.KeplerGl, {
            id: KEPLER_MAP_ID,
            width,
            height,
            appName: "DuckDB Query Map",
            version: "",
            mapboxApiAccessToken: "",
            theme: "dark",
          });

          const mapContainer = React.createElement(
            "div",
            { style: { position: "absolute", inset: 0, width: "100%", height: "100%" } },
            keplerMap,
          );

          keplerRoot.render(React.createElement(ReactRedux.Provider, { store: keplerStore }, mapContainer));
        };

        render();
        new ResizeObserver(render).observe(keplerRenderer);
        setMapStatus("Run a query with LAT/LON columns to map points.");
      }

      try {
        initializeMapRenderer();
      } catch (error) {
        console.error(error);
        setMapStatus(error?.message ?? String(error));
        setResults(error?.message ?? String(error), "message error");
      }

      try {
        initializeKeplerMap();
      } catch (error) {
        console.error(error);
        setMapStatus(`Kepler did not initialize; using MapLibre/deck renderer. ${error?.message ?? String(error)}`);
      }

      async function createDatabase(duckdb, progress) {
        const bundles = duckdb.getJsDelivrBundles();
        const bundle = await duckdb.selectBundle(bundles);
        const workerUrl = URL.createObjectURL(
          new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" }),
        );

        const worker = new Worker(workerUrl);
        const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
        await db.instantiate(bundle.mainModule, bundle.pthreadWorker, progress);
        URL.revokeObjectURL(workerUrl);
        return db;
      }

      async function fetchToOPFS(url, fileName) {
        if (!navigator.storage?.getDirectory) {
          throw new Error("OPFS is not available in this browser.");
        }

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
        }

        const root = await navigator.storage.getDirectory();
        const fileHandle = await root.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        if (response.body) {
          await response.body.pipeTo(writable);
        } else {
          await writable.write(await response.arrayBuffer());
          await writable.close();
        }

        return fileHandle;
      }

      async function needsOPFSUpdate(url, fileName) {
        try {
          const headResponse = await fetch(url, { method: "HEAD" });
          if (!headResponse.ok) return true;

          const remoteSize = headResponse.headers.get("content-length");
          const remoteModified = headResponse.headers.get("last-modified");

          const root = await navigator.storage.getDirectory();
          try {
            const localHandle = await root.getFileHandle(fileName);
            const localFile = await localHandle.getFile();

            if (remoteSize && localFile.size !== Number(remoteSize)) return true;
            if (remoteModified) {
              const remoteDate = new Date(remoteModified).getTime();
              if (Math.abs(remoteDate - localFile.lastModified) > 1000) return true;
            }

            return false;
          } catch {
            return true;
          }
        } catch (error) {
          console.warn("Metadata check failed, downloading file:", error);
          return true;
        }
      }

      const CACHED_TABLES = ["ais_position_points", "ais_latest_positions"];
      const CACHE_METADATA_FILE = "cache_metadata.json";

      async function getCachedTableMetadata() {
        try {
          const root = await navigator.storage.getDirectory();
          const handle = await root.getFileHandle(CACHE_METADATA_FILE);
          const file = await handle.getFile();
          const text = await file.text();
          return JSON.parse(text);
        } catch {
          return null;
        }
      }

      async function saveCachedTableMetadata(metadata) {
        const root = await navigator.storage.getDirectory();
        const handle = await root.getFileHandle(CACHE_METADATA_FILE, { create: true });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(metadata));
        await writable.close();
      }

      async function tablesAreCached(conn, sourceMetadata) {
        const cached = await getCachedTableMetadata();
        if (!cached) return false;
        if (cached.sourceSize !== sourceMetadata.size) return false;
        if (cached.sourceModified !== sourceMetadata.modified) return false;

        const root = await navigator.storage.getDirectory();
        for (const table of CACHED_TABLES) {
          try {
            await root.getFileHandle(`${table}.parquet`);
          } catch {
            return false;
          }
        }

        return true;
      }

      async function loadCachedTables(conn, db, duckdb) {
        setStatus("Loading cached indexes from OPFS...");
        const root = await navigator.storage.getDirectory();

        for (const table of CACHED_TABLES) {
          const fileName = `${table}.parquet`;
          const handle = await root.getFileHandle(fileName);
          await db.registerFileHandle(fileName, handle, duckdb.DuckDBDataProtocol.BROWSER_FSACCESS, true);
          await conn.query(`CREATE OR REPLACE TABLE ${table} AS SELECT * FROM '${fileName}';`);
        }

        const countTable = await conn.query("SELECT count(*) AS ship_count FROM ais_latest_positions;");
        const countRows = tableToObjects(countTable, countTable.schema.fields, 1);
        latestShipCount = Number(countRows[0]?.ship_count ?? 0);
        const reportCountTable = await conn.query("SELECT count(*) AS report_count FROM ais_position_points;");
        const reportCountRows = tableToObjects(reportCountTable, reportCountTable.schema.fields, 1);
        validPositionReportCount = Number(reportCountRows[0]?.report_count ?? 0);
      }

      async function exportCachedTables(conn, db, duckdb, sourceMetadata) {
        setStatus("Building indexes and caching to OPFS...");

        const root = await navigator.storage.getDirectory();

        for (const table of CACHED_TABLES) {
          const fileName = `${table}.parquet`;
          await conn.query(`COPY ${table} TO '${fileName}' (FORMAT PARQUET);`);

          const result = await conn.query(`SELECT * FROM read_parquet('${fileName}') LIMIT 0;`);
          const arrowData = await result.toArray();
          if (arrowData.length === 0) {
            const blob = new Blob([result.arrowBuffer], { type: "application/octet-stream" });
            const handle = await root.getFileHandle(fileName, { create: true });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
          }
        }

        await saveCachedTableMetadata(sourceMetadata);
      }

      async function hasPreAggregatedFiles() {
        try {
          const root = await navigator.storage.getDirectory();
          for (const name of PRE_AGGREGATED_FILES) {
            const handle = await root.getFileHandle(name);
            const file = await handle.getFile();
            if (file.size < 100) return false;
          }
          return true;
        } catch {
          return false;
        }
      }

      async function fetchFileToOPFS(url, fileName) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
        }
        const root = await navigator.storage.getDirectory();
        const fileHandle = await root.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        if (response.body) {
          await response.body.pipeTo(writable);
        } else {
          await writable.write(await response.arrayBuffer());
          await writable.close();
        }
        return fileHandle;
      }

      async function downloadPreAggregatedFiles() {
        setStatus("Downloading pre-aggregated AIS data...");
        const root = await navigator.storage.getDirectory();

        for (let i = 0; i < PRE_AGGREGATED_FILES.length; i++) {
          const fileName = PRE_AGGREGATED_FILES[i];
          const sourceUrl = i === 0 ? PRE_AGGREGATED_SOURCE : PRE_AGGREGATED_SHIP_SOURCE;
          setStatus(`Downloading ${fileName}...`);
          await fetchFileToOPFS(sourceUrl, fileName);
        }
      }

      async function loadPreAggregatedFiles(db, duckdb) {
        setStatus("Loading pre-aggregated AIS data...");
        const root = await navigator.storage.getDirectory();

        for (const fileName of PRE_AGGREGATED_FILES) {
          const handle = await root.getFileHandle(fileName);
          const file = await handle.getFile();
          console.log(`Loading ${fileName}: ${(file.size / 1024 / 1024).toFixed(1)} MB`);
          if (file.size < 100) {
            console.warn(`${fileName} too small (${file.size} bytes), deleting corrupted file...`);
            await root.removeEntry(fileName);
            throw new Error(`${fileName} corrupted (too small), needs re-download`);
          }
          await db.registerFileHandle(fileName, handle, duckdb.DuckDBDataProtocol.BROWSER_FSACCESS, true);
          const tableName = fileName.replace(".parquet", "");
          await conn.query(`CREATE OR REPLACE TABLE ${tableName} AS SELECT * FROM '${fileName}';`);
        }
      }

      async function getSourceMetadata(url) {
        try {
          const headResponse = await fetch(url, { method: "HEAD" });
          if (!headResponse.ok) return null;
          return {
            size: headResponse.headers.get("content-length"),
            modified: headResponse.headers.get("last-modified"),
          };
        } catch {
          return null;
        }
      }

      async function createDensityWasmEngine() {
        const response = await fetch(DENSITY_WASM_URL);
        if (!response.ok) {
          throw new Error(`Failed to load ${DENSITY_WASM_URL}: ${response.status} ${response.statusText}`);
        }

        const { instance } = await WebAssembly.instantiate(await response.arrayBuffer(), {});
        densityWasm = instance;
        densityWasmExports = instance.exports;
        return instance.exports;
      }

      async function initDensityWorker() {
        if (densityWorkerInitPromise) return densityWorkerInitPromise;

        densityWorkerInitPromise = new Promise((resolve, reject) => {
          try {
            densityWorker = new Worker(DENSITY_WORKER_URL);

            densityWorker.onmessage = (event) => {
              const { type, success, error } = event.data;
              if (type === "init_complete") {
                if (success) {
                  densityWorkerReady = true;
                  resolve();
                } else {
                  reject(new Error(error || "Worker initialization failed"));
                }
              }
            };

            densityWorker.onerror = (error) => {
              reject(new Error(`Worker error: ${error.message}`));
            };

            densityWorker.postMessage({ type: "init", wasmUrl: DENSITY_WASM_URL });
          } catch (error) {
            reject(error);
          }
        });

        return densityWorkerInitPromise;
      }

      function getArrowVectorLength(vector) {
        return vector?.length ?? vector?.numRows ?? 0;
      }

      function getArrowVectorValue(vector, index) {
        if (typeof vector.get === "function") return vector.get(index);
        return vector[index];
      }

      function getArrowColumn(table, fieldName) {
        if (typeof table.getChild === "function") {
          const column = table.getChild(fieldName);
          if (column) return column;
        }

        const fieldIndex = table.schema.fields.findIndex((field) => field.name === fieldName);
        if (fieldIndex < 0) throw new Error(`Column ${fieldName} was not found in Arrow table.`);
        if (typeof table.getChildAt === "function") return table.getChildAt(fieldIndex);
        if (Array.isArray(table.batches) && table.batches.length > 0) return table.batches[0].getChildAt(fieldIndex);
        throw new Error(`Column ${fieldName} could not be read from Arrow table.`);
      }

      function copyFloat64ArrayToWasm(values) {
        const byteLength = values.byteLength;
        const pointer = densityWasmExports.alloc_bytes(byteLength);
        if (!pointer) throw new Error(`Could not allocate ${byteLength.toLocaleString()} bytes in density WASM memory.`);
        new Uint8Array(densityWasmExports.memory.buffer, pointer, byteLength).set(new Uint8Array(values.buffer, values.byteOffset, byteLength));
        return pointer;
      }

      function arrowColumnToFloat64Array(vector, expectedLength) {
        const length = getArrowVectorLength(vector) || expectedLength;
        const values = new Float64Array(length);
        for (let index = 0; index < length; index += 1) {
          values[index] = Number(getArrowVectorValue(vector, index));
        }
        return values;
      }

      async function loadDensityPointsIntoWasm() {
        if (!densityWasmExports) await createDensityWasmEngine();
        await initDensityWorker();

        setStatus("Loading AIS coordinates into Rust/WASM density engine...");
        const table = await conn.query("SELECT latitude, longitude FROM ais_position_points;");
        const rowCount = table.numRows ?? table.length ?? 0;
        const latitudeValues = arrowColumnToFloat64Array(getArrowColumn(table, "latitude"), rowCount);
        const longitudeValues = arrowColumnToFloat64Array(getArrowColumn(table, "longitude"), rowCount);

        const loadPromise = new Promise((resolve, reject) => {
          const handler = (event) => {
            if (event.data.type === "load_points_complete") {
              densityWorker.removeEventListener("message", handler);
              if (event.data.success) {
                validPositionReportCount = Number(event.data.count);
                resolve();
              } else {
                reject(new Error(event.data.error || "Worker load_points failed"));
              }
            }
          };
          densityWorker.addEventListener("message", handler);
          densityWorker.postMessage({
            type: "load_points",
            latitudes: latitudeValues,
            longitudes: longitudeValues,
          }, [latitudeValues.buffer, longitudeValues.buffer]);
        });

        await loadPromise;
      }

      function stringifyCell(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "bigint") return value.toString();
        if (value instanceof Date) return value.toISOString();
        if (value instanceof Uint8Array) return `[${value.length} bytes]`;
        if (typeof value === "object") {
          return JSON.stringify(value, (_key, nestedValue) =>
            typeof nestedValue === "bigint" ? nestedValue.toString() : nestedValue,
          );
        }
        return String(value);
      }

      function rowToObject(row, fields) {
        if (typeof row?.toJSON === "function") return row.toJSON();
        return Object.fromEntries(fields.map((field, index) => [field.name, row[field.name] ?? row[index]]));
      }

      function tableToObjects(table, fields, limit = Infinity) {
        const boundedTable = Number.isFinite(limit) && typeof table.slice === "function" ? table.slice(0, limit) : table;
        return boundedTable
          .toArray()
          .slice(0, limit)
          .map((row) => rowToObject(row, fields));
      }

      function getQueryResult(table) {
        const fields = table.schema.fields;
        const rowCount = table.numRows ?? table.length ?? 0;
        const rows = tableToObjects(table, fields, MAX_QUERY_PREVIEW_ROWS);
        return { fields, rows, rowCount, previewRowCount: rows.length, truncated: rowCount > rows.length };
      }

      function normalizeFieldName(name) {
        return name.toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function findCoordinateFields(fields) {
        let latitudeField;
        let longitudeField;

        for (const field of fields) {
          const name = normalizeFieldName(field.name);
          if (!latitudeField && (name === "lat" || name === "latitude" || name.endsWith("lat") || name.endsWith("latitude"))) {
            latitudeField = field;
          }
          if (
            !longitudeField &&
            (name === "lon" ||
              name === "lng" ||
              name === "long" ||
              name === "longitude" ||
              name.endsWith("lon") ||
              name.endsWith("lng") ||
              name.endsWith("long") ||
              name.endsWith("longitude"))
          ) {
            longitudeField = field;
          }
        }

        return latitudeField && longitudeField ? { latitudeField, longitudeField } : null;
      }

      function normalizeLongitude(longitude) {
        return ((((longitude + 180) % 360) + 360) % 360) - 180;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatCompactNumber(value) {
        return new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(value);
      }

      function sqlNumber(value) {
        if (!Number.isFinite(value)) throw new Error(`Invalid SQL number: ${value}`);
        return String(value);
      }

      function getPaddedViewportBounds() {
        if (!mapLibreMap) return null;

        const bounds = mapLibreMap.getBounds();
        const rawWest = bounds.getWest();
        const rawEast = bounds.getEast();
        const rawSouth = bounds.getSouth();
        const rawNorth = bounds.getNorth();
        const longitudeSpan = Math.max(0, rawEast - rawWest);
        const latitudeSpan = Math.max(0, rawNorth - rawSouth);
        const longitudePadding = Math.max(0.25, longitudeSpan * VIEWPORT_PADDING_RATIO);
        const latitudePadding = Math.max(0.25, latitudeSpan * VIEWPORT_PADDING_RATIO);
        const allLongitudes = longitudeSpan + longitudePadding * 2 >= 360;
        const west = normalizeLongitude(rawWest - longitudePadding);
        const east = normalizeLongitude(rawEast + longitudePadding);

        return {
          west,
          east,
          south: clamp(rawSouth - latitudePadding, -90, 90),
          north: clamp(rawNorth + latitudePadding, -90, 90),
          allLongitudes,
          crossesAntimeridian: !allLongitudes && west > east,
        };
      }

      function getViewportPredicate(bounds) {
        const latitudePredicate = `latitude BETWEEN ${sqlNumber(bounds.south)} AND ${sqlNumber(bounds.north)}`;
        if (bounds.allLongitudes) return latitudePredicate;

        const longitudePredicate = bounds.crossesAntimeridian
          ? `(longitude >= ${sqlNumber(bounds.west)} OR longitude <= ${sqlNumber(bounds.east)})`
          : `longitude BETWEEN ${sqlNumber(bounds.west)} AND ${sqlNumber(bounds.east)}`;
        return `${latitudePredicate} AND ${longitudePredicate}`;
      }

      function getViewportLod() {
        const zoom = mapLibreMap?.getZoom() ?? 1;
        if (zoom < SHIP_GLYPH_MIN_ZOOM && selectedShipMmsi) {
          clearShipTrack();
        }
        return zoom >= SHIP_GLYPH_MIN_ZOOM ? "ships" : "tiles";
      }

      async function prepareAisSpatialData() {
        setStatus("Preparing AIS positions for viewport and tile rendering...");
        await conn.query(`
          CREATE OR REPLACE TABLE ais_position_points AS
          SELECT
            CAST(LAT AS DOUBLE) AS latitude,
            CAST(LON AS DOUBLE) AS longitude
          FROM test_parquet
          WHERE LAT BETWEEN ${-MERCATOR_MAX_LATITUDE} AND ${MERCATOR_MAX_LATITUDE}
            AND LON BETWEEN -180 AND 180;
        `);

        await conn.query(`
          CREATE OR REPLACE TABLE ais_latest_positions AS
          WITH valid AS (
            SELECT
              CAST(MMSI AS VARCHAR) AS mmsi,
              CAST(LAT AS DOUBLE) AS latitude,
              CAST(LON AS DOUBLE) AS longitude,
              CAST(extract(epoch from BaseDateTime) AS BIGINT) AS position_time,
              COALESCE(CAST(extract(epoch from BaseDateTime) AS BIGINT), 0) AS position_rank,
              CASE WHEN trim(VesselName) <> '' THEN trim(VesselName) ELSE NULL END AS name,
              CASE WHEN trim(VesselType) <> '' THEN trim(VesselType) ELSE NULL END AS ship_type,
              CASE WHEN trim(Status) <> '' THEN trim(Status) ELSE NULL END AS navigation_status,
              TRY_CAST(SOG AS DOUBLE) AS speed_over_ground,
              TRY_CAST(COG AS DOUBLE) AS raw_course_over_ground,
              TRY_CAST(Heading AS DOUBLE) AS heading
            FROM test_parquet
            WHERE MMSI IS NOT NULL
              AND LAT BETWEEN -90 AND 90
              AND LON BETWEEN -180 AND 180
          )
          SELECT
            mmsi,
            arg_max(latitude, position_rank) AS latitude,
            arg_max(longitude, position_rank) AS longitude,
            max(position_time) AS position_time,
            arg_max(name, position_rank) AS name,
            arg_max(ship_type, position_rank) AS ship_type,
            arg_max(navigation_status, position_rank) AS navigation_status,
            arg_max(speed_over_ground, position_rank) AS speed_over_ground,
            CASE
              WHEN arg_max(raw_course_over_ground, position_rank) BETWEEN 0 AND 360 THEN arg_max(raw_course_over_ground, position_rank)
              ELSE NULL
            END AS course_over_ground,
            arg_max(heading, position_rank) AS heading
          FROM valid
          GROUP BY mmsi;
        `);

        const countTable = await conn.query("SELECT count(*) AS ship_count FROM ais_latest_positions;");
        const countRows = tableToObjects(countTable, countTable.schema.fields, 1);
        latestShipCount = Number(countRows[0]?.ship_count ?? 0);
        const reportCountTable = await conn.query("SELECT count(*) AS report_count FROM ais_position_points;");
        const reportCountRows = tableToObjects(reportCountTable, reportCountTable.schema.fields, 1);
        validPositionReportCount = Number(reportCountRows[0]?.report_count ?? 0);
        await loadDensityPointsIntoWasm();
        aisSpatialReady = true;
      }

      async function loadCachedAisData() {
        const countTable = await conn.query("SELECT count(*) AS ship_count FROM ais_latest_positions;");
        const countRows = tableToObjects(countTable, countTable.schema.fields, 1);
        latestShipCount = Number(countRows[0]?.ship_count ?? 0);
        const reportCountTable = await conn.query("SELECT count(*) AS report_count FROM ais_position_points;");
        const reportCountRows = tableToObjects(reportCountTable, reportCountTable.schema.fields, 1);
        validPositionReportCount = Number(reportCountRows[0]?.report_count ?? 0);
        await loadDensityPointsIntoWasm();
        aisSpatialReady = true;
      }

      async function queryViewportShips(bounds) {
        const predicate = getViewportPredicate(bounds);
        const table = await conn.query(`
          SELECT
            mmsi,
            latitude,
            longitude,
            position_time,
            name,
            ship_type,
            navigation_status,
            speed_over_ground,
            course_over_ground,
            heading
          FROM ais_latest_positions
          WHERE ${predicate}
          ORDER BY position_time DESC NULLS LAST
          LIMIT ${MAX_INDIVIDUAL_SHIPS + 1};
        `);
        return tableToObjects(table, table.schema.fields, MAX_INDIVIDUAL_SHIPS + 1);
      }

      function tileXToLongitude(x, z) {
        return (x / 2 ** z) * 360 - 180;
      }

      function longitudeToTileX(longitude, z) {
        const tileCount = 2 ** z;
        return Math.floor(((clamp(longitude, -180, 180) + 180) / 360) * tileCount);
      }

      function tileYToLatitude(y, z) {
        const mercatorY = Math.PI - (2 * Math.PI * y) / 2 ** z;
        return (Math.atan(Math.sinh(mercatorY)) * 180) / Math.PI;
      }

      function latitudeToTileY(latitude, z) {
        const clampedLatitude = clamp(latitude, -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);
        const radians = (clampedLatitude * Math.PI) / 180;
        return Math.floor(((1 - Math.log(Math.tan(radians) + 1 / Math.cos(radians)) / Math.PI) / 2) * 2 ** z);
      }

      function clampTileIndex(value, z) {
        return clamp(value, 0, 2 ** z - 1);
      }

      function getDensityTileKey({ x, y, z }) {
        return `${z}/${x}/${y}`;
      }

      function parseDensityTileKey(key) {
        const [z, x, y] = key.split("/").map(Number);
        return { x, y, z };
      }

      function getCachedParentDensityTileKey(key) {
        const { x, y, z } = parseDensityTileKey(key);
        for (let depth = 1; depth <= DENSITY_TILE_PARENT_FALLBACK_DEPTH && z - depth >= 0; depth += 1) {
          const scale = 2 ** depth;
          const parentKey = getDensityTileKey({ z: z - depth, x: Math.floor(x / scale), y: Math.floor(y / scale) });
          if (densityTileCache.has(parentKey)) return parentKey;
        }
        return null;
      }

      function getDensityTileCoordinates(tileRequest) {
        const index = tileRequest.index ?? tileRequest;
        return {
          x: Number(index.x ?? tileRequest.x),
          y: Number(index.y ?? tileRequest.y),
          z: Number(index.z ?? tileRequest.z),
        };
      }

      function createTransparentDensityTile() {
        const canvas = document.createElement("canvas");
        canvas.width = DENSITY_TILE_SIZE;
        canvas.height = DENSITY_TILE_SIZE;
        return canvas;
      }

      function createDensityTileCanvasFromRgba(rgbaBytes) {
        const canvas = document.createElement("canvas");
        canvas.width = DENSITY_TILE_SIZE;
        canvas.height = DENSITY_TILE_SIZE;
        const context = canvas.getContext("2d");
        context.putImageData(new ImageData(rgbaBytes, DENSITY_TILE_SIZE, DENSITY_TILE_SIZE), 0, 0);
        return canvas;
      }

      async function getDensityTileData(tileRequest) {
        const { x, y, z } = getDensityTileCoordinates(tileRequest);
        if (![x, y, z].every(Number.isFinite)) return null;

        const west = tileXToLongitude(x, z);
        const east = tileXToLongitude(x + 1, z);
        const north = clamp(tileYToLatitude(y, z), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);
        const south = clamp(tileYToLatitude(y + 1, z), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);

        try {
          if (!densityWorkerReady) {
            await initDensityWorker();
          }

          const key = getDensityTileKey({ x, y, z });
          const tilePromise = new Promise((resolve, reject) => {
            const handler = (event) => {
              if (event.data.type === "tile_ready" && event.data.key === key) {
                densityWorker.removeEventListener("message", handler);
                if (event.data.success) {
                  const canvas = createDensityTileCanvasFromRgba(event.data.rgba);
                  resolve({ image: canvas, bounds: [west, south, east, north], count: 0 });
                } else {
                  reject(new Error(event.data.error || "Tile render failed"));
                }
              }
            };
            densityWorker.addEventListener("message", handler);
            densityWorker.postMessage({
              type: "render_tile",
              z,
              x,
              y,
              size: DENSITY_TILE_SIZE,
              key,
            });
          });

          return await tilePromise;
        } catch (error) {
          console.error(`Density tile ${z}/${x}/${y} failed`, error);
          return { image: createTransparentDensityTile(), bounds: [west, south, east, north], count: 0 };
        }
      }

      function getDensityRenderZoom() {
        return Math.ceil(mapLibreMap?.getZoom() ?? 0);
      }

      function tileIntersectsViewport(x, y, z, viewportWest, viewportEast, viewportSouth, viewportNorth, allLongitudes) {
        const tileWest = tileXToLongitude(x, z);
        const tileEast = tileXToLongitude(x + 1, z);
        const tileNorth = clamp(tileYToLatitude(y, z), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);
        const tileSouth = clamp(tileYToLatitude(y + 1, z), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);

        if (tileSouth > viewportNorth || tileNorth < viewportSouth) return false;

        if (allLongitudes) return true;

        const normTileWest = normalizeLongitude(tileWest);
        const normTileEast = normalizeLongitude(tileEast);

        if (normTileWest <= normTileEast) {
          return normTileEast >= viewportWest && normTileWest <= viewportEast;
        }

        return true;
      }

      function getVisibleDensityTileRequests() {
        if (!mapLibreMap) return [];

        const baseZoom = clamp(getDensityRenderZoom(), 0, DENSITY_TILE_MAX_ZOOM);
        const higherZoom = Math.min(baseZoom + 1, DENSITY_TILE_MAX_ZOOM);
        const bounds = mapLibreMap.getBounds();
        const rawWest = bounds.getWest();
        const rawEast = bounds.getEast();
        const north = clamp(bounds.getNorth(), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);
        const south = clamp(bounds.getSouth(), -MERCATOR_MAX_LATITUDE, MERCATOR_MAX_LATITUDE);
        const allLongitudes = rawEast - rawWest >= 360;
        const west = normalizeLongitude(rawWest);
        const east = normalizeLongitude(rawEast);
        const requests = [];

        const appendTileRange = (z, startX, endX, minY, maxY) => {
          const tileCount = 2 ** z;
          const minX = clampTileIndex(startX - DENSITY_TILE_BUFFER, z);
          const maxX = clampTileIndex(endX + DENSITY_TILE_BUFFER, z);
          for (let x = minX; x <= maxX; x += 1) {
            for (let y = minY; y <= maxY; y += 1) {
              if (tileIntersectsViewport(x, y, z, west, east, south, north, allLongitudes)) {
                requests.push({ x, y, z });
              }
            }
          }
        };

        const baseTileCount = 2 ** baseZoom;
        const baseMinY = clampTileIndex(latitudeToTileY(north, baseZoom) - DENSITY_TILE_BUFFER, baseZoom);
        const baseMaxY = clampTileIndex(latitudeToTileY(south, baseZoom) + DENSITY_TILE_BUFFER, baseZoom);

        const appendXRangeForZoom = (z, tileCount) => {
          if (allLongitudes) {
            appendTileRange(z, 0, tileCount - 1, baseMinY, baseMaxY);
          } else if (west <= east) {
            appendTileRange(z, longitudeToTileX(west, z), longitudeToTileX(east, z), baseMinY, baseMaxY);
          } else {
            appendTileRange(z, longitudeToTileX(west, z), tileCount - 1, baseMinY, baseMaxY);
            appendTileRange(z, 0, longitudeToTileX(east, z), baseMinY, baseMaxY);
          }
        };

        appendXRangeForZoom(baseZoom, baseTileCount);

        if (higherZoom > baseZoom) {
          const higherTileCount = 2 ** higherZoom;
          const higherMinY = clampTileIndex(latitudeToTileY(north, higherZoom) - DENSITY_TILE_BUFFER, higherZoom);
          const higherMaxY = clampTileIndex(latitudeToTileY(south, higherZoom) + DENSITY_TILE_BUFFER, higherZoom);

          const appendHigherXRange = (z, startX, endX, minY, maxY) => {
            const tileCount = 2 ** z;
            const minX = clampTileIndex(startX - DENSITY_TILE_BUFFER, z);
            const maxX = clampTileIndex(endX + DENSITY_TILE_BUFFER, z);
            for (let x = minX; x <= maxX; x += 1) {
              for (let y = minY; y <= maxY; y += 1) {
                if (tileIntersectsViewport(x, y, z, west, east, south, north, allLongitudes)) {
                  requests.push({ x, y, z });
                }
              }
            }
          };

          if (allLongitudes) {
            appendHigherXRange(higherZoom, 0, higherTileCount - 1, higherMinY, higherMaxY);
          } else if (west <= east) {
            appendHigherXRange(higherZoom, longitudeToTileX(west, higherZoom), longitudeToTileX(east, higherZoom), higherMinY, higherMaxY);
          } else {
            appendHigherXRange(higherZoom, longitudeToTileX(west, higherZoom), higherTileCount - 1, higherMinY, higherMaxY);
            appendHigherXRange(higherZoom, 0, longitudeToTileX(east, higherZoom), higherMinY, higherMaxY);
          }
        }

        return requests;
      }

      function pruneDensityTileCache() {
        while (densityTileCache.size > DENSITY_TILE_CACHE_LIMIT) {
          const oldestKey = densityTileCache.keys().next().value;
          densityTileCache.delete(oldestKey);
          densityTileGenerations.delete(oldestKey);
        }
      }

      function scheduleDensityTileRedraw() {
        if (densityTileRedrawFrame) return;
        densityTileRedrawFrame = window.requestAnimationFrame(() => {
          densityTileRedrawFrame = 0;
          if (!hasDeckRenderer()) return;
          rerenderActiveViewportLayers();
        });
      }

      function requestMissingDensityTiles(tileRequests) {
        const renderVersion = densityTileRenderVersion;

        pendingTileRequests = tileRequests.filter((tileRequest) => {
          const key = getDensityTileKey(tileRequest);
          return !(densityTileGenerations.get(key) === renderVersion || densityTileRequests.has(key));
        });

        if (pendingTileRequests.length === 0) return;

        if (densityTileDebounceTimer) {
          window.clearTimeout(densityTileDebounceTimer);
        }

        densityTileDebounceTimer = window.setTimeout(() => {
          densityTileDebounceTimer = null;
          const tilesToRequest = pendingTileRequests;
          pendingTileRequests = [];

          for (const tileRequest of tilesToRequest) {
            const key = getDensityTileKey(tileRequest);
            if (densityTileGenerations.get(key) === renderVersion || densityTileRequests.has(key)) continue;

            const request = getDensityTileData(tileRequest)
              .then((tileData) => {
                densityTileRequests.delete(key);
                if (tileData) {
                  densityTileCache.delete(key);
                  densityTileCache.set(key, tileData);
                  densityTileGenerations.set(key, renderVersion);
                  pruneDensityTileCache();
                }
                scheduleDensityTileRedraw();
              })
              .catch((error) => {
                densityTileRequests.delete(key);
                console.error(`Density tile ${key} failed`, error);
              });
            densityTileRequests.set(key, request);
          }
        }, DENSITY_TILE_REQUEST_DEBOUNCE_MS);
      }

      function sameDensityTileKeys(leftKeys, rightKeys) {
        if (leftKeys.length !== rightKeys.length) return false;
        return leftKeys.every((key, index) => key === rightKeys[index]);
      }

      function beginDensityTileRender() {
        const tileRequests = getVisibleDensityTileRequests();
        const tileKeys = tileRequests.map(getDensityTileKey);
        const tileSetChanged = !sameDensityTileKeys(tileKeys, densityTileTargetKeys);

        densityTileRenderVersion += 1;
        densityTileTargetRequests = tileRequests;

        if (tileSetChanged) {
          densityTilePreviousKeys = densityTileDisplayedKeys.filter((key) => densityTileCache.has(key));
          densityTileTargetKeys = tileKeys;
          densityTileTransitionStart = 0;
          densityTileTransitionStartedAt = performance.now();

          for (const [key, promise] of densityTileRequests.entries()) {
            if (!tileKeys.includes(key)) {
              densityTileRequests.delete(key);
            }
          }
        }

        requestMissingDensityTiles(densityTileTargetRequests);
      }

      function getDensityTileCoverage() {
        if (densityTileTargetKeys.length === 0) return 1;
        const readyCount = densityTileTargetKeys.filter((key) => densityTileGenerations.get(key) === densityTileRenderVersion).length;
        return readyCount / densityTileTargetKeys.length;
      }

      function scheduleDensityTransitionFrame() {
        if (densityTileTransitionFrame) return;
        densityTileTransitionFrame = window.requestAnimationFrame(() => {
          densityTileTransitionFrame = 0;
          rerenderActiveViewportLayers();
        });
      }

      function createDensityBitmapLayer(key, tileData, opacity, phase) {
        return new window.deck.BitmapLayer({
          id: `ais-density-tile-${phase}-${key}`,
          bounds: tileData.bounds,
          image: tileData.image,
          opacity,
        });
      }

      function createDensityBitmapLayers() {
        if (densityTileTargetRequests.length === 0) beginDensityTileRender();

        requestMissingDensityTiles(densityTileTargetRequests);

        const targetCoverage = getDensityTileCoverage();
        const holdElapsedMs = performance.now() - densityTileTransitionStartedAt;
        const shouldStartTransition =
          densityTilePreviousKeys.length > 0 &&
          !densityTileTransitionStart &&
          (targetCoverage >= DENSITY_TILE_READY_THRESHOLD || holdElapsedMs >= DENSITY_TILE_MAX_HOLD_MS);

        if (shouldStartTransition) densityTileTransitionStart = performance.now();

        const transitionProgress = densityTileTransitionStart
          ? clamp((performance.now() - densityTileTransitionStart) / DENSITY_TILE_FADE_MS, 0, 1)
          : densityTilePreviousKeys.length > 0
            ? 0
            : 1;

        const layers = [];
        const displayedKeys = [];

        if (densityTilePreviousKeys.length > 0 && transitionProgress < 1) {
          for (const key of densityTilePreviousKeys) {
            const tileData = densityTileCache.get(key);
            if (!tileData?.image) continue;
            layers.push(createDensityBitmapLayer(key, tileData, aggregateOpacity * (1 - transitionProgress), "previous"));
            displayedKeys.push(key);
          }
        }

        if (transitionProgress > 0 || densityTilePreviousKeys.length === 0) {
          const targetOpacity = densityTilePreviousKeys.length > 0 ? aggregateOpacity * transitionProgress : aggregateOpacity;
          const fallbackKeys = new Set();

          const sortedTargetKeys = [...densityTileTargetKeys].sort((a, b) => {
            const zoomA = parseDensityTileKey(a).z;
            const zoomB = parseDensityTileKey(b).z;
            return zoomA - zoomB;
          });

          for (const key of sortedTargetKeys) {
            const tileData = densityTileCache.get(key);
            if (tileData?.image) {
              layers.push(createDensityBitmapLayer(key, tileData, targetOpacity, "target"));
              displayedKeys.push(key);
              continue;
            }

            const fallbackKey = getCachedParentDensityTileKey(key);
            if (!fallbackKey || fallbackKeys.has(fallbackKey)) continue;
            const fallbackTileData = densityTileCache.get(fallbackKey);
            if (!fallbackTileData?.image) continue;
            layers.push(createDensityBitmapLayer(fallbackKey, fallbackTileData, targetOpacity, "fallback"));
            displayedKeys.push(fallbackKey);
            fallbackKeys.add(fallbackKey);
          }
        }

        if (densityTilePreviousKeys.length > 0 && transitionProgress < 1) {
          scheduleDensityTransitionFrame();
        } else if (transitionProgress >= 1) {
          densityTilePreviousKeys = [];
        }

        if (displayedKeys.length > 0) densityTileDisplayedKeys = displayedKeys;
        return layers;
      }

      function renderDynamicDensityTiles() {
        if (!hasDeckRenderer() || !window.deck) return;

        activeViewportMode = "tiles";
        currentViewportShipRows = [];
        beginDensityTileRender();
        setDeckLayers(createDensityBitmapLayers());
        setMapStatus(
          `Rendering AIS density as dynamic ${DENSITY_TILE_SIZE}px slippy tiles from ${validPositionReportCount.toLocaleString()} valid position reports. Ship heading glyphs begin at zoom ${SHIP_GLYPH_MIN_ZOOM}.`,
        );
      }

      function inferKeplerFieldType(field, rows) {
        const name = field.name.toLowerCase();
        const sample = rows.find((row) => row[field.name] !== null && row[field.name] !== undefined)?.[field.name];
        if (sample instanceof Date || name.includes("date") || name.includes("time")) return "timestamp";
        if (typeof sample === "bigint") return "integer";
        if (typeof sample === "number") return Number.isInteger(sample) ? "integer" : "real";
        if (typeof sample === "boolean") return "boolean";
        return "string";
      }

      function normalizeKeplerValue(value) {
        if (typeof value === "bigint") return Number.isSafeInteger(Number(value)) ? Number(value) : value.toString();
        if (value instanceof Date) return value.toISOString();
        if (value instanceof Uint8Array) return `[${value.length} bytes]`;
        if (value && typeof value === "object") return stringifyCell(value);
        return value;
      }

      function createKeplerConfig(latitudeField, longitudeField) {
        return {
          visState: {
            layers: [
              {
                id: "query-points",
                type: "point",
                config: {
                  dataId: KEPLER_DATA_ID,
                  label: "Query coordinates",
                  color: [138, 180, 248],
                  columns: {
                    lat: latitudeField.name,
                    lng: longitudeField.name,
                    altitude: null,
                  },
                  isVisible: true,
                  visConfig: {
                    radius: 10,
                    fixedRadius: false,
                    opacity: 0.85,
                    outline: false,
                    thickness: 2,
                  },
                },
                visualChannels: {
                  colorField: null,
                  colorScale: "quantile",
                  sizeField: null,
                  sizeScale: "linear",
                },
              },
            ],
          },
          mapStyle: {
            styleType: MAP_STYLE_ID,
            mapStyles: MAP_STYLES,
          },
        };
      }

      function clearKeplerMap(message) {
        if (keplerStore && window.KeplerGl?.resetMapConfig) {
          keplerStore.dispatch(window.KeplerGl.resetMapConfig());
        }
        currentHexbinPoints = [];
        currentHexbinLabel = "";
        setMapStatus(message);
      }

      function updateMapRenderer(points) {
        currentHexbinPoints = points;
        if (!hasDeckRenderer() || !window.deck) {
          setMapStatus("deck.gl renderer is not initialized; ship positions could not be drawn.");
          return null;
        }

        return renderCurrentHexbins(true);
      }

      function renderCurrentHexbins(fitBounds) {
        const points = currentHexbinPoints;
        if (!hasDeckRenderer() || !window.deck || points.length === 0) return null;

        const radius = getHexbinRadius(points);

        setDeckLayers(
          [
            new window.deck.HexagonLayer({
              id: "query-hexbin-fallback",
              data: points,
              getPosition: (point) => [point.longitude, point.latitude],
              getColorValue: (hexbinPoints) => hexbinPoints.length,
              getElevationValue: (hexbinPoints) => hexbinPoints.length,
              colorScaleType: "quantize",
              colorAggregation: "COUNT",
              elevationAggregation: "COUNT",
              colorRange: [
                [49, 130, 189, 170],
                [107, 174, 214, 190],
                [158, 202, 225, 210],
                [254, 178, 76, 225],
                [240, 59, 32, 240],
                [189, 0, 38, 250],
              ],
              coverage: 0.85,
              elevationScale: 50,
              extruded: true,
              pickable: true,
              radius,
            }),
          ],
        );

        if (!mapLibreMap || points.length === 0) return radius;
        if (!fitBounds) {
          setHexbinStatus(radius);
          return radius;
        }

        const bounds = new window.maplibregl.LngLatBounds();
        for (const point of points) bounds.extend([point.longitude, point.latitude]);
        if (!bounds.isEmpty()) {
          mapLibreMap.fitBounds(bounds, { padding: 48, maxZoom: 12, duration: 500 });
          window.setTimeout(() => {
            renderCurrentHexbins(false);
          }, 550);
        }
        setHexbinStatus(radius);
        return radius;
      }

      function setHexbinStatus(radius) {
        if (!currentHexbinPoints.length || !currentHexbinLabel) return;
        setMapStatus(
          `Rendered ${currentHexbinPoints.length.toLocaleString()} report${currentHexbinPoints.length === 1 ? "" : "s"} as count-colored hexbins from ${currentHexbinLabel}. Radius: ${(radius / 1000).toFixed(1)} km.`,
        );
      }

      function getHexbinRadius(points) {
        if (mapLibreMap) {
          const center = mapLibreMap.getCenter();
          const latitudeScale = Math.max(0.2, Math.cos((center.lat * Math.PI) / 180));
          const metersPerPixel = (156_543.03392 * latitudeScale) / 2 ** mapLibreMap.getZoom();
          return Math.min(MAX_HEXBIN_RADIUS_METERS, Math.max(MIN_HEXBIN_RADIUS_METERS, metersPerPixel * HEXBIN_SCREEN_RADIUS_PX));
        }

        if (points.length < 2) return 5000;

        let minLatitude = Infinity;
        let maxLatitude = -Infinity;
        let minLongitude = Infinity;
        let maxLongitude = -Infinity;
        for (const point of points) {
          minLatitude = Math.min(minLatitude, point.latitude);
          maxLatitude = Math.max(maxLatitude, point.latitude);
          minLongitude = Math.min(minLongitude, point.longitude);
          maxLongitude = Math.max(maxLongitude, point.longitude);
        }

        const centerLatitude = (minLatitude + maxLatitude) / 2;
        const latitudeMeters = Math.max(0, maxLatitude - minLatitude) * 111_320;
        const longitudeMeters = Math.max(0, maxLongitude - minLongitude) * 111_320 * Math.cos((centerLatitude * Math.PI) / 180);
        const extentMeters = Math.max(latitudeMeters, Math.abs(longitudeMeters));
        if (!Number.isFinite(extentMeters) || extentMeters <= 0) return 5000;
        return Math.min(250_000, Math.max(5_000, extentMeters / 80));
      }

      function getShipColor(row) {
        const speed = Number(row.speed_over_ground);
        if (Number.isFinite(speed) && speed <= 1) return [255, 60, 60, 220];
        if (Number.isFinite(speed) && speed >= 50) return [255, 200, 0, 230];
        return [0, 220, 100, 220];
      }

      function createShipGlyphLayer(rows) {
        return new window.deck.ScatterplotLayer({
          id: "viewport-ship-arrows",
          data: rows,
          filled: true,
          getFillColor: getShipColor,
          getLineColor: [255, 255, 255, 235],
          getPosition: (row) => [Number(row.longitude), Number(row.latitude)],
          getRadius: (row) => {
            const speed = Number(row.speed_over_ground);
            return Number.isFinite(speed) && speed > 1 ? 5 : 4;
          },
          getAngle: (row) => {
            let angle = 0;
            const heading = Number(row.heading);
            if (Number.isFinite(heading) && heading >= 0 && heading < 360) {
              angle = heading;
            } else {
              const cog = Number(row.course_over_ground);
              if (Number.isFinite(cog) && cog >= 0 && cog < 360) {
                angle = cog;
              }
            }
            return Math.round(angle / 30) * 30;
          },
          lineWidthMinPixels: 1.5,
          lineWidthUnits: "pixels",
          opacity: 0.9,
          pickable: true,
          radiusMaxPixels: 9,
          radiusMinPixels: 4,
          radiusUnits: "pixels",
          stroked: true,
          updateTriggers: {
            getFillColor: 0,
            getLineColor: 0,
            getRadius: 0,
            getAngle: 0,
          },
        });
      }

      function getShipLayerProps() {
        return {
          onClick: (info) => {
            if (!info.object || !mapLibreMap) return;
            const zoom = mapLibreMap.getZoom();
            if (zoom < SHIP_GLYPH_MIN_ZOOM) return;

            const mmsi = info.object.mmsi;
            if (selectedShipMmsi === mmsi) {
              clearShipTrack();
            } else {
              selectShipTrack(mmsi, info.object);
            }
          },
          getTooltip: ({ object, index }) => {
            const row = object ?? currentViewportShipRows[index];
            if (!row) return null;
            return {
              text: [
                row.name || `MMSI ${row.mmsi}`,
                `MMSI: ${row.mmsi}`,
                `Ship type: ${row.ship_type || "unknown"}`,
                `Status: ${row.navigation_status || "unknown"}`,
              ].join("\n"),
            };
          },
        };
      }

      async function selectShipTrack(mmsi, shipRow) {
        selectedShipMmsi = mmsi;
        selectedShipTrackData = [];
        selectedShipTrackLayer = null;

        const positionTime = Number(shipRow.position_time);
        if (!Number.isFinite(positionTime) || positionTime <= 0) {
          setMapStatus(`No position time available for MMSI ${mmsi}.`);
          return;
        }

        const fourHoursSeconds = 4 * 60 * 60;
        const startTime = positionTime - fourHoursSeconds;

        try {
          const table = await conn.query(`
            SELECT CAST(LAT AS DOUBLE) AS latitude, CAST(LON AS DOUBLE) AS longitude, CAST(extract(epoch from BaseDateTime) AS BIGINT) AS position_time
            FROM test_parquet
            WHERE CAST(MMSI AS VARCHAR) = '${mmsi}'
              AND BaseDateTime IS NOT NULL
              AND LAT IS NOT NULL
              AND LON IS NOT NULL
              AND LAT != 0
              AND LON != 0
              AND CAST(LAT AS DOUBLE) BETWEEN -90 AND 90
              AND CAST(LON AS DOUBLE) BETWEEN -180 AND 180
              AND CAST(extract(epoch from BaseDateTime) AS BIGINT) >= ${startTime}
              AND CAST(extract(epoch from BaseDateTime) AS BIGINT) <= ${positionTime}
            ORDER BY position_time;
          `);

          const rows = tableToObjects(table, table.schema.fields, Infinity);
          const trackPoints = [];
          let minTime = Infinity;
          let maxTime = -Infinity;

          for (const row of rows) {
            const lat = Number(row.latitude);
            const lon = Number(row.longitude);
            const time = Number(row.position_time);
            if (Number.isFinite(lat) && Number.isFinite(lon) && Number.isFinite(time)) {
              trackPoints.push({ latitude: lat, longitude: lon, position_time: time });
              minTime = Math.min(minTime, time);
              maxTime = Math.max(maxTime, time);
            }
          }

          selectedShipTrackData = trackPoints;
          selectedShipTrackLayer = createTrackLayer(trackPoints, minTime, maxTime);

          const shipName = shipRow.name || `MMSI ${mmsi}`;
          if (trackPoints.length === 0) {
            setMapStatus(`No track data found for ${shipName} in the last 4 hours.`);
          } else {
            setMapStatus(`Showing ${trackPoints.length.toLocaleString()} track points for ${shipName} over the last 4 hours. Click the ship again to hide.`);
          }

          rerenderActiveViewportLayers();
        } catch (error) {
          console.error(`Failed to load track for MMSI ${mmsi}:`, error);
          setMapStatus(`Failed to load track for MMSI ${mmsi}.`);
        }
      }

      function clearShipTrack() {
        selectedShipMmsi = null;
        selectedShipTrackData = [];
        selectedShipTrackLayer = null;
        rerenderActiveViewportLayers();
      }

      function createTrackLayer(trackPoints, minTime, maxTime) {
        if (trackPoints.length < 2) return null;

        const timeRange = maxTime - minTime || 1;

        const segments = [];
        for (let i = 0; i < trackPoints.length - 1; i++) {
          const p0 = trackPoints[i];
          const p1 = trackPoints[i + 1];
          const avgTime = (p0.position_time + p1.position_time) / 2;
          const timeFraction = (avgTime - minTime) / timeRange;
          const alpha = 0.3 + timeFraction * 0.7;

          segments.push({
            path: [[p0.longitude, p0.latitude], [p1.longitude, p1.latitude]],
            timeFraction,
            alpha,
          });
        }

        return new window.deck.PathLayer({
          id: "ship-track",
          data: segments,
          getPath: (d) => d.path,
          getColor: (d) => {
            const darkBlue = [10, 20, 60];
            return [...darkBlue, Math.round(d.alpha * 255)];
          },
          getWidth: 3,
          widthMinPixels: 2,
          widthMaxPixels: 4,
          widthUnits: "pixels",
          pickable: false,
        });
      }

      function rerenderActiveViewportLayers() {
        if (!hasDeckRenderer() || !window.deck) return;
        const layers = [...createDensityBitmapLayers()];
        if (selectedShipTrackLayer) layers.push(selectedShipTrackLayer);
        if (activeViewportMode === "ships") {
          layers.push(createShipGlyphLayer(currentViewportShipRows));
        }
        setDeckLayers(layers, getShipLayerProps());
      }

      function renderViewportShips(rows, elapsedMs) {
        if (!hasDeckRenderer() || !window.deck) return;

        activeViewportMode = "ships";
        currentViewportShipRows = rows;
        beginDensityTileRender();

        const layers = [...createDensityBitmapLayers()];
        if (selectedShipTrackLayer) layers.push(selectedShipTrackLayer);
        layers.push(createShipGlyphLayer(rows));

        setDeckLayers(layers, getShipLayerProps());

        setMapStatus(
          `Rendered ${rows.length.toLocaleString()} visible ships as heading glyphs from ${latestShipCount.toLocaleString()} latest positions. Query/render: ${elapsedMs.toFixed(1)} ms.`,
        );
      }

      async function refreshViewportLayer() {
        if (!aisSpatialReady || !conn || !mapLibreMap || !hasDeckRenderer()) return;

        const bounds = getPaddedViewportBounds();
        if (!bounds) return;

        const runId = ++viewportRenderRun;
        const startedAt = performance.now();
        let lod = getViewportLod();
        setMapStatus(`Loading ${lod} layer for visible viewport...`);

        try {
          if (lod === "tiles") {
            renderDynamicDensityTiles();
            return;
          }

          if (lod === "ships") {
            const rows = await queryViewportShips(bounds);
            if (runId !== viewportRenderRun) return;
            if (rows.length <= MAX_INDIVIDUAL_SHIPS) {
              renderViewportShips(rows, performance.now() - startedAt);
              return;
            }
            renderDynamicDensityTiles();
            setMapStatus(
              `Visible viewport exceeds ${MAX_INDIVIDUAL_SHIPS.toLocaleString()} ships at zoom ${mapLibreMap.getZoom().toFixed(1)}; keeping dynamic raster tiles until the view is less crowded.`,
            );
            return;
          }
        } catch (error) {
          if (runId !== viewportRenderRun) return;
          console.error(error);
          setMapStatus(error?.message ?? String(error));
        }
      }

      function requestViewportRender(delay = VIEWPORT_RENDER_DEBOUNCE_MS) {
        window.clearTimeout(viewportRenderTimer);
        viewportRenderTimer = window.setTimeout(refreshViewportLayer, delay);
      }

      function updateKeplerMap(queryResult) {
        if (queryResult.rowCount === 0) {
          clearKeplerMap("Query returned no rows to map.");
          return;
        }

        if (queryResult.truncated) {
          clearKeplerMap(
            `Query returned ${queryResult.rowCount.toLocaleString()} rows; showing a ${queryResult.previewRowCount.toLocaleString()} row table preview only.`,
          );
          return;
        }

        const coordinateFields = findCoordinateFields(queryResult.fields);
        if (!coordinateFields) {
          const fieldNames = queryResult.fields.map((field) => field.name).join(", ");
          clearKeplerMap(`No latitude/longitude columns found in query preview. Query fields: ${fieldNames || "none"}.`);
          return;
        }

        const { latitudeField, longitudeField } = coordinateFields;
        const fields = queryResult.fields.map((field) => ({
          name: field.name,
          type: field === latitudeField || field === longitudeField ? "real" : inferKeplerFieldType(field, queryResult.rows),
        }));
        const rows = [];
        const points = [];

        for (const row of queryResult.rows) {
          const latitude = Number(row[latitudeField.name]);
          const longitude = Number(row[longitudeField.name]);
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) continue;
          if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) continue;

          points.push({ latitude, longitude });

          rows.push(
            queryResult.fields.map((field) => {
              if (field === latitudeField) return latitude;
              if (field === longitudeField) return longitude;
              return normalizeKeplerValue(row[field.name]);
            }),
          );
        }

        if (rows.length === 0) {
          clearKeplerMap(`Found ${latitudeField.name}/${longitudeField.name}, but no valid coordinate rows.`);
          return;
        }

        currentHexbinLabel = `${latitudeField.name}/${longitudeField.name}`;
        updateMapRenderer(points);

        if (rows.length <= MAX_KEPLER_ROWS && keplerStore && window.KeplerGl?.addDataToMap) {
          keplerStore.dispatch(
            window.KeplerGl.addDataToMap({
              datasets: {
                info: {
                  id: KEPLER_DATA_ID,
                  label: `Query result ${++keplerDatasetVersion}`,
                },
                data: { fields, rows },
              },
              options: {
                centerMap: true,
                readOnly: true,
                keepExistingConfig: false,
              },
              config: createKeplerConfig(latitudeField, longitudeField),
            }),
          );
        }
        setHexbinStatus(getHexbinRadius(points));
      }

      function renderTable(queryResult) {
        if (queryResult.rowCount === 0) {
          setResults("Query completed with no rows.");
          return;
        }

        const { fields, rows } = queryResult;
        const visibleRows = rows.slice(0, MAX_TABLE_ROWS);
        const resultTable = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");
        const headerRow = document.createElement("tr");

        for (const field of fields) {
          const th = document.createElement("th");
          th.textContent = field.name;
          headerRow.append(th);
        }

        thead.append(headerRow);

        for (const row of visibleRows) {
          const tr = document.createElement("tr");
          for (const field of fields) {
            const td = document.createElement("td");
            td.textContent = stringifyCell(row[field.name]);
            tr.append(td);
          }
          tbody.append(tr);
        }

        resultTable.append(thead, tbody);
        if (queryResult.rowCount > MAX_TABLE_ROWS) {
          const message = document.createElement("p");
          message.className = "message";
          message.textContent = queryResult.truncated
            ? `Showing first ${MAX_TABLE_ROWS.toLocaleString()} rows. Query returned ${queryResult.rowCount.toLocaleString()} rows, so the table and ad hoc query map are capped to avoid browser memory pressure.`
            : `Showing first ${MAX_TABLE_ROWS.toLocaleString()} of ${queryResult.rowCount.toLocaleString()} rows. The ad hoc query map uses all returned rows.`;
          results.replaceChildren(message, resultTable);
        } else {
          results.replaceChildren(resultTable);
        }
      }

      async function runQuery() {
        const sql = queryInput.value.trim();
        if (!sql || !conn) return;

        const runId = ++activeRun;
        runButton.disabled = true;
        timing.textContent = "Running query...";
        setResults("Running query...");

        const startedAt = performance.now();
        try {
          const table = await conn.query(sql);
          const elapsedMs = performance.now() - startedAt;
          if (runId !== activeRun) return;

          timing.textContent = `Query executed in ${elapsedMs.toFixed(2)} ms.`;
          const queryResult = getQueryResult(table);
          renderTable(queryResult);
        } catch (error) {
          const elapsedMs = performance.now() - startedAt;
          if (runId !== activeRun) return;

          console.error(error);
          timing.textContent = `Query failed after ${elapsedMs.toFixed(2)} ms.`;
          setResults(error?.message ?? String(error), "message error");
        } finally {
          if (runId === activeRun) runButton.disabled = false;
        }
      }

      try {
        const duckdb = await import(`https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@${DUCKDB_WASM_VERSION}/+esm`);
        const db = await createDatabase(duckdb, (progress) => {
          if (progress?.bytesLoaded && progress?.bytesTotal) {
            setStatus(`Loading DuckDB-WASM ${Math.round((progress.bytesLoaded / progress.bytesTotal) * 100)}%...`);
          }
        });

        let dataMode = "opfs";
        let loadMode = "pre-aggregated";
        let fileHandle = null;
        let statusDetail = "";

        conn = await db.connect();

        try {
          if (!navigator.storage?.getDirectory) {
            throw new Error("OPFS is not available in this browser.");
          }

          const root = await navigator.storage.getDirectory();

          // ── Priority 1: Pre-aggregated files already in OPFS ──────────────
          if (await hasPreAggregatedFiles()) {
            try {
              await loadPreAggregatedFiles(db, duckdb);
              loadMode = "pre-aggregated-cached";
