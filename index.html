            } catch (loadError) {
              console.warn("Cached pre-aggregated files failed to load, re-downloading:", loadError);
              // Delete any remaining corrupted files
              for (const name of PRE_AGGREGATED_FILES) {
                try { await root.removeEntry(name); } catch {}
              }
              // Fall through to Priority 2 to re-download
              await downloadPreAggregatedFiles();
              await loadPreAggregatedFiles(db, duckdb);
              loadMode = "pre-aggregated-downloaded";
            }
          } else {
            // ── Priority 2: Download pre-aggregated files from server ───────
            try {
              const posHead = await fetch(PRE_AGGREGATED_SOURCE, { method: "HEAD" });
              const shipHead = await fetch(PRE_AGGREGATED_SHIP_SOURCE, { method: "HEAD" });

              if (posHead.ok && shipHead.ok) {
                await downloadPreAggregatedFiles();
                await loadPreAggregatedFiles(db, duckdb);
                loadMode = "pre-aggregated-downloaded";
              } else {
                throw new Error("Pre-aggregated files not available on server");
              }
            } catch (preAggError) {
              console.warn("Pre-aggregated files not available, falling back to raw Parquet:", preAggError);

              // ── Priority 3: Fall back to raw test.parquet + browser aggregation ──
              loadMode = "raw-browser-build";
              setStatus(`Checking local cache for ${OPFS_FILE_NAME}...`);
              const shouldUpdate = await needsOPFSUpdate(SOURCE_URL, OPFS_FILE_NAME);

              if (shouldUpdate) {
                setStatus(`Downloading ${SOURCE_URL} to OPFS...`);
                fileHandle = await fetchToOPFS(SOURCE_URL, OPFS_FILE_NAME);
              } else {
                fileHandle = await root.getFileHandle(OPFS_FILE_NAME);
              }

              await db.registerFileHandle(OPFS_FILE_NAME, fileHandle, duckdb.DuckDBDataProtocol.BROWSER_FSACCESS, true);
              await conn.query(`CREATE OR REPLACE VIEW test_parquet AS SELECT * FROM '${OPFS_FILE_NAME}';`);

              const sourceMetadata = await getSourceMetadata(SOURCE_URL);
              const cached = await tablesAreCached(conn, sourceMetadata);

              if (cached) {
                await loadCachedTables(conn, db, duckdb);
              } else {
                await prepareAisSpatialData();
                if (sourceMetadata) {
                  await exportCachedTables(conn, db, duckdb, sourceMetadata);
                }
              }
            }
          }

          // ── Download test.parquet to OPFS if not already present (for ad-hoc queries and track lookups) ──
          if (loadMode.startsWith("pre-aggregated")) {
            try {
              const existingHandle = await root.getFileHandle(OPFS_FILE_NAME);
              fileHandle = existingHandle;
            } catch {
              setStatus(`Downloading ${OPFS_FILE_NAME} to OPFS for ad-hoc queries...`);
              fileHandle = await fetchToOPFS(SOURCE_URL, OPFS_FILE_NAME);
            }
            await db.registerFileHandle(OPFS_FILE_NAME, fileHandle, duckdb.DuckDBDataProtocol.BROWSER_FSACCESS, true);
            await conn.query(`CREATE OR REPLACE VIEW test_parquet AS SELECT * FROM '${OPFS_FILE_NAME}';`);
          }
        } catch (opfsError) {
          console.warn("OPFS failed, falling back to remote HTTP:", opfsError);
          dataMode = "remote";
          loadMode = "raw-remote";
          await conn.query(`CREATE OR REPLACE VIEW test_parquet AS SELECT * FROM '${REMOTE_URL}';`);
          await prepareAisSpatialData();
        }

        const countTable = await conn.query("SELECT count(*) AS ship_count FROM ais_latest_positions;");
        const countRows = tableToObjects(countTable, countTable.schema.fields, 1);
        latestShipCount = Number(countRows[0]?.ship_count ?? 0);
        const reportCountTable = await conn.query("SELECT count(*) AS report_count FROM ais_position_points;");
        const reportCountRows = tableToObjects(reportCountTable, reportCountTable.schema.fields, 1);
        validPositionReportCount = Number(reportCountRows[0]?.report_count ?? 0);

        await loadDensityPointsIntoWasm();
        aisSpatialReady = true;

        window.duckdbWasm = db;
        if (fileHandle) window.testParquetOPFSHandle = fileHandle;

        runButton.disabled = false;

        const modeLabels = {
          "pre-aggregated-cached": "Pre-aggregated data and test.parquet loaded from cache",
          "pre-aggregated-downloaded": "Pre-aggregated data and test.parquet downloaded and cached",
          "raw-browser-build": `${OPFS_FILE_NAME} loaded from OPFS, indexes built in browser`,
          "raw-remote": `Running from remote ${REMOTE_URL}; data not cached locally`,
        };

        statusDetail = modeLabels[loadMode] || "Ready";
        setStatus(
          `${statusDetail}; ${validPositionReportCount.toLocaleString()} AIS positions and ${latestShipCount.toLocaleString()} latest ship positions are prepared.`,
        );

        setResults("Ready. Run the default query or enter your own SQL against test_parquet. Aggregate zooms use dynamic raster density tiles; close zooms use viewport ship heading glyphs.");
        requestViewportRender(0);
      } catch (error) {
        console.error(error);
        setStatus("Failed to initialize DuckDB-WASM. See the browser console for details.");
        setResults(error?.message ?? String(error), "message error");
      }

      runButton.addEventListener("click", runQuery);
      aggregateOpacityInput.addEventListener("input", () => {
        aggregateOpacity = Number(aggregateOpacityInput.value) / 100;
        updateAggregateOpacityStatus();
        rerenderActiveViewportLayers();
      });
      queryInput.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          runQuery();
        }
      });
    </script>
  </body>
</html>
